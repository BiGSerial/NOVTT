name: NOVTT checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'test/**'
      - 'ci/**'
      - 'perf/**'
      - 'hotfix/**'
      - 'release/**'

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name and merge target
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          pattern='^(feature|fix|chore|docs|refactor|test|ci|perf|hotfix|release)/[a-z0-9][a-z0-9._-]*$'
          if [ "$HEAD_REF" != "develop" ] && ! [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::Branch '$HEAD_REF' fora do padrão. Veja docs/development/branching.md"
            exit 1
          fi
          if [ "$BASE_REF" = "main" ] && ! [[ "$HEAD_REF" =~ ^(develop|release/.+|hotfix/.+)$ ]]; then
            echo "::error::PRs para main só podem vir de develop, release/* ou hotfix/*."
            exit 1
          fi
          echo "Branch '$HEAD_REF' -> '$BASE_REF' OK"

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Validate PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit
        run: composer test
      - name: Composer audit
        run: composer audit

  player-pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/player-pwa/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Build
        run: npm run build
