openapi: 3.1.0
info:
  title: NOVTT API
  version: 1.6.1-character-portrait
  license:
    name: MIT
    identifier: MIT
  description: |
    Versioned HTTP contract for Sprint 001 (SPEC-SPRINT-001): presets, campaigns, invitations,
    characters, NPCs, drafts and master review of sheet changes. 1.1 adds the live table
    (SPEC-MVP-002): accounts, paired devices, sessions and their event stream, master roll
    requests and official rolls, live state, notes, whispers, clues, Roteiro and Atlas.
    1.3 adds the preset engine (ADR 0012): manifest/2 and rules/2 packages with an optional
    compendium, rights status in the catalogue, derived values, creation progress and decision
    trace on characters, the creation gate on approval and the live-session lock on proposals.
    Rights review (`novtt:preset:rights`) and canonical publication (`novtt:preset:publish`) are
    team CLI commands with no HTTP route; canonical publication fails with `preset.rights_blocked`
    unless the package passes the rights gate.
    Realtime: committed session events are also pushed on private Reverb channels
    (`campaign.{id}`, `campaign.{id}.master`, `user.{id}`; event `session.event`,
    contracts/events/session-event.v1.schema.json), authorized at /api/broadcasting/auth.

    Conventions
    - Every endpoint requires an authenticated actor (ADR 0009) and is authorized server-side.
    - Resources the actor may not see return **404**, never 403, so existence does not leak.
    - Errors are `application/problem+json` (RFC 9457) with a stable `code` (contracts/http/problem.v1.schema.json).
    - 409 = revision/state conflict (`current_revision` included when safe); 422 = validation failure
      (`validation` holds a novtt.validation-result/1 already filtered for the viewer).
    - Mutations that create side effects take an `Idempotency-Key` (UUID). Same actor + key + payload
      returns the original result; same key with another payload returns 409 `idempotency.key_reused`.
    - Optimistic concurrency uses explicit version fields in the body (`expected_revision`,
      `draft_version`, `review_version`).
    - Lists are cursor-paginated (`cursor`, `limit` ≤ 100) and return `next_cursor`.
servers:
  - url: /api/v1
security:
  - sanctumCookie: []
  - bearerToken: []
tags:
  - name: presets
    description: Preset catalogue, personal library and imports
  - name: campaigns
    description: Campaigns and membership
  - name: invitations
    description: Campaign invitations
  - name: characters
    description: Character library and campaign instances
  - name: npcs
    description: NPC library and campaign NPCs
  - name: review
    description: Drafts, proposals, master review, grants
  - name: accounts
    description: Sign-up, sign-in and the current user
  - name: devices
    description: Paired master devices (ADR 0011)
  - name: live
    description: Live session, rolls and the master's table (SPEC-MVP-002)
  - name: world
    description: Session prep (Roteiro) and the campaign Atlas
paths:
  /presets:
    get:
      tags: [presets]
      summary: List preset versions visible to the actor (canonical published + own personal library)
      operationId: listPresets
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: scope
          in: query
          schema: { enum: [all, canonical, personal], default: all }
      responses:
        '200':
          description: Page of preset versions
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PresetVersionSummary' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /presets/imports:
    post:
      tags: [presets]
      summary: Import a preset version into the actor's personal library
      description: |
        Validation in three stages: JSON syntax, structural contracts, engine compatibility.
        The import is transactional and bounded (request ≤ 512 KiB). A personal import never
        receives canonical status. An existing (family, variant, version) is never overwritten.
      operationId: importPreset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetPackage' }
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresetVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /preset-versions/{presetVersionId}:
    get:
      tags: [presets]
      summary: Get a preset version (content included)
      operationId: getPresetVersion
      parameters: [{ $ref: '#/components/parameters/PresetVersionId' }]
      responses:
        '200':
          description: Preset version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /campaigns:
    get:
      tags: [campaigns]
      summary: List campaigns where the actor is an active member
      operationId: listCampaigns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '200':
          description: Page of campaigns
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [campaigns]
      summary: Create a campaign pinned to a preset version; the actor becomes its master
      operationId: createCampaign
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, preset_version_id]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 4000 }
                preset_version_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{campaignId}:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [campaigns]
      summary: Get a campaign the actor is a member of
      operationId: getCampaign
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [campaigns]
      summary: Update name/description (master). The pinned preset version cannot change here.
      operationId: updateCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 4000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{campaignId}/archive:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    post:
      tags: [campaigns]
      summary: Archive (master). History is preserved; archiving is not deletion.
      operationId: archiveCampaign
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /campaigns/{campaignId}/members:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [campaigns]
      summary: List active members
      operationId: listMembers
      responses:
        '200':
          description: Active members
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Member' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [campaigns]
      summary: Remove a player (master) or leave (self). The last master cannot be removed.
      operationId: removeMember
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /campaigns/{campaignId}/invitations:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [invitations]
      summary: List invitations (master). Tokens are never returned after creation.
      operationId: listInvitations
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [invitations]
      summary: Create an invitation (master). The secret token appears only in this response.
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expires_in_hours]
              properties:
                expires_in_hours: { type: integer, minimum: 1, maximum: 720 }
                max_uses: { type: integer, minimum: 1, maximum: 100, default: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invitation'
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, minLength: 43, maxLength: 128 }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{campaignId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [invitations]
      summary: Revoke (master)
      operationId: revokeInvitation
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /invitations/accept:
    post:
      tags: [invitations]
      summary: Join a campaign as player using an invitation token
      description: Idempotent for an actor that is already an active member. Invalid, expired, revoked and exhausted tokens all return the same 404 `invitation.not_found`.
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 128 }
      responses:
        '200':
          description: Member (new or existing)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /characters:
    get:
      tags: [characters]
      summary: Actor's personal character library
      operationId: listLibraryCharacters
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LibraryCharacter' } }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [characters]
      summary: Create a personal library character
      operationId: createLibraryCharacter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                preset_version_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryCharacter' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /characters/{characterId}:
    parameters:
      - name: characterId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [characters]
      summary: Get a personal library character
      operationId: getLibraryCharacter
      responses:
        '200':
          description: Library character
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryCharacter' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [characters]
      summary: Delete a library entry. Campaign instances and their history are not affected.
      operationId: deleteLibraryCharacter
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /characters/{characterId}/archive:
    parameters:
      - name: characterId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [characters]
      summary: Archive a personal library character
      operationId: archiveLibraryCharacter
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryCharacter' }
        '404': { $ref: '#/components/responses/NotFound' }

  /campaigns/{campaignId}/characters:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [characters]
      summary: Campaign characters visible to the actor (sheets filtered per field access)
      operationId: listCampaignCharacters
      responses:
        '200':
          description: Characters
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CampaignCharacter' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [characters]
      summary: Bring a character into the campaign (player member). Creates a separate instance pinned to the campaign preset version.
      operationId: createCampaignCharacter
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                library_character_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created (status draft)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignCharacter' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /campaign-characters/{campaignCharacterId}:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    get:
      tags: [characters]
      summary: Get a campaign character with the sheet filtered for the actor
      operationId: getCampaignCharacter
      responses:
        '200':
          description: Character with sheet filtered for the actor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignCharacter' }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaign-characters/{campaignCharacterId}/archive:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    post:
      tags: [characters]
      summary: Archive (master). Preserves history.
      operationId: archiveCampaignCharacter
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignCharacter' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /campaign-characters/{campaignCharacterId}/transfer:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    post:
      tags: [characters]
      summary: Transfer control to another player member (master). Audited.
      operationId: transferCampaignCharacter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to_user_id]
              properties:
                to_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Transferred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignCharacter' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /campaign-characters/{campaignCharacterId}/custody:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    put:
      tags: [characters]
      summary: Master takes temporary custody. Audited.
      operationId: takeCustody
      responses:
        '200':
          description: Custody taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignCharacter' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [characters]
      summary: Release custody back to the player. Audited.
      operationId: releaseCustody
      responses:
        '200':
          description: Custody released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignCharacter' }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaign-characters/{campaignCharacterId}/approve:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    post:
      tags: [review]
      summary: Approve the character into the campaign (master). Requires its initial proposal to be applied.
      description: For rules/2 presets every creation step must be complete, otherwise 422 `character.creation_incomplete` (with `steps`).
      operationId: approveCampaignCharacter
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignCharacter' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaign-characters/{campaignCharacterId}/grants:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    get:
      tags: [review]
      summary: Budget grants and balances visible to the actor
      operationId: listGrants
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Grant' } }
                  balances: { type: object, additionalProperties: { type: integer }, description: Remaining balance per budget }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [review]
      summary: Grant budget (master). Granting never spends points.
      operationId: createGrant
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [budget_id, amount]
              properties:
                budget_id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
                amount: { type: integer, minimum: -10000, maximum: 10000, not: { const: 0 } }
                reason: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /npcs:
    get:
      tags: [npcs]
      summary: Actor's NPC library
      operationId: listNpcs
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '200':
          description: NPCs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LibraryNpc' } }
    post:
      tags: [npcs]
      summary: Create a personal NPC
      operationId: createNpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                preset_version_id: { type: string, format: uuid }
                sheet: { type: object }
                private_notes: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryNpc' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{campaignId}/npcs:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [npcs]
      summary: Campaign NPCs (master only in Sprint 001)
      operationId: listCampaignNpcs
      responses:
        '200':
          description: NPCs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CampaignNpc' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [npcs]
      summary: Add an NPC to the campaign (master). Copies a sanitized sheet; private notes are never copied.
      operationId: createCampaignNpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source_npc_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignNpc' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaign-characters/{campaignCharacterId}/draft:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    get:
      tags: [review]
      summary: Actor's draft for this character (player in control)
      operationId: getDraft
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [review]
      summary: Save the draft. Never touches the official sheet. Returns a filtered validation preview.
      operationId: saveDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draft_version, change_set]
              properties:
                draft_version: { type: integer, minimum: 0, description: 0 creates the draft }
                change_set: { $ref: '../sheets/sheet-change-set.v1.schema.json' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaign-characters/{campaignCharacterId}/change-requests:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    get:
      tags: [review]
      summary: List change requests of a campaign character
      operationId: listChangeRequests
      responses:
        '200':
          description: Change requests (history included)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ChangeRequest' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [review]
      summary: Submit the current draft as a proposal. At most one active proposal per character.
      description: |
        The author is always the authenticated actor. When the preset sets
        `governance.lock_during_session` and the campaign has an active live session, players get
        409 `character.locked_by_session` (drafts stay editable).
      operationId: submitChangeRequest
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draft_version]
              properties:
                draft_version: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /change-requests/{changeRequestId}:
    parameters: [{ $ref: '#/components/parameters/ChangeRequestId' }]
    get:
      tags: [review]
      summary: Proposal grouped by section, with decisions and validation
      operationId: getChangeRequest
      responses:
        '200':
          description: Change request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /change-requests/{changeRequestId}/withdraw:
    parameters: [{ $ref: '#/components/parameters/ChangeRequestId' }]
    post:
      tags: [review]
      summary: Author withdraws an active proposal
      operationId: withdrawChangeRequest
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /change-requests/{changeRequestId}/decisions:
    parameters: [{ $ref: '#/components/parameters/ChangeRequestId' }]
    put:
      tags: [review]
      summary: Record provisional decisions (master). Batch approval only sets provisional state; it never applies.
      description: |
        Approving several operations of one section at once is allowed. Every rejection carries
        its own reason (10–1000 chars). A provisional rejection is never overwritten by a batch
        approval: changing it requires an individual decision entry with `override: true`.
      operationId: decideOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [review_version, decisions]
              properties:
                review_version: { type: integer, minimum: 1 }
                decisions:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required: [operation_ids, decision]
                        properties:
                          operation_ids: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: string, maxLength: 64 } }
                          decision: { const: approved }
                      - type: object
                        additionalProperties: false
                        required: [operation_ids, decision, reason]
                        properties:
                          operation_ids: { type: array, minItems: 1, maxItems: 1, items: { type: string, maxLength: 64 } }
                          decision: { const: rejected }
                          reason: { type: string, minLength: 10, maxLength: 1000 }
                      - type: object
                        additionalProperties: false
                        required: [operation_ids, decision, override]
                        properties:
                          operation_ids: { type: array, minItems: 1, maxItems: 1, items: { type: string, maxLength: 64 } }
                          decision: { const: approved }
                          override: { const: true }
      responses:
        '200':
          description: Updated (review_version incremented)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /change-requests/{changeRequestId}/finalize:
    parameters: [{ $ref: '#/components/parameters/ChangeRequestId' }]
    post:
      tags: [review]
      summary: Finalize (master). Every operation must have a decision.
      description: |
        Validates the whole approved set in the engine against the current official sheet, then
        applies it atomically (lock, monotonic revision, canonical and historical snapshots,
        decisions, audit, outbox) or nothing. Rejecting everything creates no new revision.
      operationId: finalizeChangeRequest
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [review_version]
              properties:
                review_version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Finalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaign-characters/{campaignCharacterId}/draft/rebase-preview:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    post:
      tags: [review]
      summary: Three-way comparison of a stale draft (base snapshot, current sheet, draft operations). No mutation.
      description: |
        With at most one active proposal per character, staleness arises in drafts: another
        proposal was applied after the draft was based. Operations identical to ones rejected in a
        finalized proposal are reported as `previously_rejected` and never return silently.
        Values of fields the actor cannot read are null.
      operationId: previewDraftRebase
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RebasePreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /campaign-characters/{campaignCharacterId}/draft/rebase:
    parameters: [{ $ref: '#/components/parameters/CampaignCharacterId' }]
    post:
      tags: [review]
      summary: Confirm a rebase (author). Every conflict needs an explicit resolution; permissions and revisions are rechecked.
      operationId: confirmDraftRebase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preview_token, resolutions]
              properties:
                preview_token: { type: string, maxLength: 128 }
                resolutions:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [operation_id, resolution]
                    properties:
                      operation_id: { type: string, maxLength: 64 }
                      resolution: { enum: [keep_mine, take_current, drop] }
      responses:
        '200':
          description: Draft rebased onto the current revision (draft_version incremented)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/register:
    post:
      tags: [accounts]
      summary: Create an account and sign in (first-party session)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                email: { type: string, format: email, maxLength: 190 }
                password: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '201': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [accounts]
      summary: Sign in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, maxLength: 190 }
                password: { type: string, maxLength: 200 }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [accounts]
      summary: Sign out and invalidate the session
      operationId: logout
      security: []
      responses:
        '204': { description: Signed out }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me:
    get:
      tags: [accounts]
      summary: The signed-in user (and the paired device, on a paired tablet)
      operationId: me
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /pairing:
    post:
      tags: [devices]
      summary: A new device asks for a one-time pairing code (ADR 0011)
      description: Returns a 6-digit code to show on screen and a claim secret the device keeps. Codes live two minutes; only digests are stored.
      operationId: createPairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_label]
              properties:
                device_label: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '201':
          description: Pairing started
          content:
            application/json:
              schema:
                type: object
                required: [pairing_id, code, claim_secret, expires_at]
                properties:
                  pairing_id: { type: string, format: uuid }
                  code: { type: string, pattern: '^\d{6}$' }
                  claim_secret: { type: string, minLength: 43, maxLength: 43 }
                  expires_at: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /pairing/{pairingId}/claim:
    parameters: [{ name: pairingId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [devices]
      summary: The new device claims its session once a master confirmed the code
      operationId: claimPairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claim_secret]
              properties:
                claim_secret: { type: string, minLength: 43, maxLength: 43 }
      responses:
        '200':
          description: Paired; this browser now has its own revocable session
          content:
            application/json:
              schema:
                type: object
                required: [status, me]
                properties:
                  status: { const: claimed }
                  me: { $ref: '#/components/schemas/Me' }
        '202': { description: Not confirmed yet (poll again), content: { application/json: { schema: { type: object, properties: { status: { const: pending } } } } } }
        '410': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /pairing/confirm:
    post:
      tags: [devices]
      summary: A signed-in master confirms the code shown on the new device
      operationId: confirmPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { description: Confirmed, content: { application/json: { schema: { type: object, properties: { pairing_id: { type: string, format: uuid }, device_label: { type: string }, status: { const: confirmed } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /devices:
    get:
      tags: [devices]
      summary: The master's active paired devices
      operationId: listDevices
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id: { type: string, format: uuid }
                        label: { type: string }
                        last_seen_at: { type: [string, 'null'], format: date-time }
                        created_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/{deviceId}:
    parameters: [{ name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [devices]
      summary: Revoke a paired device (its session ends on the next request)
      operationId: revokeDevice
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/roteiros:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [world]
      summary: Session prep documents (master only)
      operationId: listRoteiros
      responses:
        '200': { description: Roteiros, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Roteiro' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [world]
      summary: Create a roteiro
      operationId: createRoteiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                content: { $ref: '#/components/schemas/RoteiroContent' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Roteiro' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /roteiros/{roteiroId}:
    parameters: [{ name: roteiroId, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [world]
      summary: Replace a roteiro (optimistic revision)
      operationId: updateRoteiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, title]
              properties:
                revision: { type: integer, minimum: 1 }
                title: { type: string, minLength: 1, maxLength: 120 }
                content: { $ref: '#/components/schemas/RoteiroContent' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Roteiro' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /roteiros/{roteiroId}/archive:
    parameters: [{ name: roteiroId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [world]
      summary: Archive a roteiro
      operationId: archiveRoteiro
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/atlas:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [world]
      summary: Atlas entries (players get only entries known to players, public summary only)
      operationId: listAtlas
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AtlasEntry' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [world]
      summary: Create an Atlas entry (master only)
      operationId: createAtlasEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtlasEntryInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AtlasEntry' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /atlas/{entryId}:
    parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [world]
      summary: Update an Atlas entry (optimistic revision)
      operationId: updateAtlasEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AtlasEntryInput'
                - type: object
                  required: [revision]
                  properties: { revision: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/AtlasEntry' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /atlas/{entryId}/timeline:
    parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [world]
      summary: Record how an entry evolved (defaults to the open session)
      operationId: addAtlasTimeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
                session_id: { type: [string, 'null'], format: uuid }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/AtlasTimelineItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/sessions/current:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [live]
      summary: The campaign's open session, if any
      operationId: currentSession
      responses:
        '200': { description: Session or null, content: { application/json: { schema: { type: object, properties: { session: { oneOf: [{ $ref: '#/components/schemas/GameSession' }, { type: 'null' }] } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/sessions:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    post:
      tags: [live]
      summary: Start a session (master); at most one open session per campaign
      operationId: startSession
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                roteiro_id: { type: [string, 'null'], format: uuid, description: 'Seeds the compass, clocks and clues' }
      responses:
        '201': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/GameSession' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions/{sessionId}/{action}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - { name: action, in: path, required: true, schema: { enum: [pause, resume, end] } }
    post:
      tags: [live]
      summary: Pause, resume or end the session (master). Ending closes open roll requests.
      operationId: transitionSession
      responses:
        '200': { description: New state, content: { application/json: { schema: { $ref: '#/components/schemas/GameSession' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions/{sessionId}/snapshot:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [live]
      summary: Everything the actor may see of the session (first load and reconciliation)
      operationId: sessionSnapshot
      responses:
        '200': { description: Snapshot filtered for the actor, content: { application/json: { schema: { $ref: '#/components/schemas/TableSnapshot' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{sessionId}/events:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [live]
      summary: Session events after a sequence number that the actor may see, in order
      operationId: sessionEvents
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: Events (novtt.session-event/1)
          content:
            application/json:
              schema:
                type: object
                required: [data, last_seq, has_more]
                properties:
                  data: { type: array, items: { $ref: '../events/session-event.v1.schema.json' } }
                  last_seq: { type: integer }
                  has_more: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{sessionId}/compass:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    put:
      tags: [live]
      summary: Replace the master's scene compass (master only)
      operationId: saveCompass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, compass]
              properties:
                revision: { type: integer, minimum: 1 }
                compass: { $ref: '#/components/schemas/Compass' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/GameSession' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sessions/{sessionId}/initiative:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    put:
      tags: [live]
      summary: Replace the initiative order (master; visible to the table by name only)
      operationId: saveInitiative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, entries, turn, round]
              properties:
                revision: { type: integer, minimum: 1 }
                entries:
                  type: array
                  maxItems: 30
                  items: { type: object, required: [kind, id], properties: { kind: { enum: [character, npc] }, id: { type: string, format: uuid } } }
                turn: { type: integer, minimum: 0 }
                round: { type: integer, minimum: 1 }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/GameSession' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions/{sessionId}/plot:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    put:
      tags: [live]
      summary: Replace the session plot and/or move the current scene (master only)
      description: Scene status is recomputed from `current`. Moving the current scene re-points the compass (scene, objective, next unrevealed clue); clocks and spotlight are kept. Emits master event plot.updated.
      operationId: savePlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, plot]
              properties:
                revision: { type: integer, minimum: 1 }
                plot: { $ref: '#/components/schemas/Plot' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/GameSession' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sessions/{sessionId}/stage:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    put:
      tags: [live]
      summary: Show a scene card to the whole table, or clear it (master only)
      description: Emits table event stage.updated. A staged image becomes readable by the players.
      operationId: saveStage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, stage]
              properties:
                revision: { type: integer, minimum: 1 }
                stage:
                  oneOf:
                    - type: 'null'
                    - type: object
                      additionalProperties: false
                      required: [title]
                      properties:
                        title: { type: string, minLength: 1, maxLength: 120 }
                        text: { type: [string, 'null'], maxLength: 1500 }
                        art: { $ref: '#/components/schemas/SceneArt' }
                        image_id: { type: [string, 'null'], format: uuid }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/GameSession' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sessions/{sessionId}/atmosphere:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    put:
      tags: [live]
      summary: Set the table atmosphere (time of day, weather, time flow; master only)
      description: |
        SPEC-MVP-003 NT-10. Replaces the whole atmosphere and emits table event atmosphere.updated.
        The atmosphere has its own revision, so it never conflicts with plot, stage or compass
        edits guarded by the session revision. While time_scale > 0 clients advance the hour
        locally: (hour + time_scale × minutes since set_at / 60) mod 24.
      operationId: saveAtmosphere
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hour, weather, intensity, time_scale, transition_seconds]
              properties:
                hour: { type: number, minimum: 0, exclusiveMaximum: 24, multipleOf: 0.25 }
                weather: { $ref: '#/components/schemas/Weather' }
                intensity: { type: number, minimum: 0, maximum: 1, description: Stored rounded to 2 decimals }
                fog: { type: number, minimum: 0, maximum: 1, description: 'Fog layer that coexists with any weather; default 0' }
                time_scale: { type: integer, minimum: 0, maximum: 120, description: Game minutes per real minute; 0 freezes time }
                transition_seconds: { type: integer, minimum: 0, maximum: 30, description: How long clients animate the change }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Atmosphere' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{campaignId}/images:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    post:
      tags: [live]
      summary: Upload a campaign image (master any kind; players portraits only)
      description: JPEG, PNG or WebP up to 4 MB and 6000 px per side (12 MP). The server verifies the type, re-encodes to WebP (longest side 1024 px for portraits, 1600 px otherwise) and drops all metadata. At most 300 images per campaign (409 image.limit).
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind: { enum: [portrait, scene, handout] }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignImage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /images/{imageId}:
    parameters: [{ name: imageId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [live]
      summary: Download a campaign image the actor may see
      description: Masters see every image of their campaign. Players see character portraits, their own uploads, portraits of NPCs revealed in the open session, the staged scene image and images of clues revealed to the table or to them. Anything else is 404.
      operationId: showImage
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: WebP bytes (Cache-Control private, immutable; nosniff; CSP sandbox)
          headers:
            ETag: { schema: { type: string } }
          content:
            image/webp:
              schema: { type: string, format: binary }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/portraits/{kind}/{subjectId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - { name: kind, in: path, required: true, schema: { enum: [character, npc] } }
      - { name: subjectId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [live]
      summary: Set or clear the portrait of a character (master or its player) or NPC (master)
      description: Emits portrait.updated to the table for characters and to the master for NPCs.
      operationId: setPortrait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_id]
              properties:
                image_id: { type: [string, 'null'], format: uuid, description: A portrait image of the same campaign }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { type: object, properties: { kind: { enum: [character, npc] }, id: { type: string, format: uuid }, portrait_image_id: { type: [string, 'null'], format: uuid } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /campaigns/{campaignId}/prep/carry-over:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [world]
      summary: What the next roteiro starts from (master only)
      description: Unrevealed clues of the most recent session, unresolved Atlas threads, what each character wants, and the last roteiro title.
      operationId: prepCarryOver
      responses:
        '200': { description: Carry-over, content: { application/json: { schema: { $ref: '#/components/schemas/PrepCarryOver' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{sessionId}/roll-requests:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [live]
      summary: Request a test from a character (master). The pool/bonus comes from the official sheet.
      operationId: requestRoll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RollSpecInput'
                - type: object
                  required: [campaign_character_id]
                  properties:
                    campaign_character_id: { type: string, format: uuid }
                    suggestion_id: { type: [string, 'null'], format: uuid }
                    allows_choice: { type: boolean, description: Pool mode only; the roller may roll 1..pool dice }
                    attempts: { type: integer, minimum: 1, maximum: 5, default: 1 }
                    secret: { type: boolean, default: true, description: 'Result only to the master and the roller (default, owner decision 2026-11-22). false rolls at the table; a secret result can be revealed later.' }
                    expires_in_seconds: { type: [integer, 'null'], minimum: 30, maximum: 3600 }
      responses:
        '201': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/RollRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /roll-requests/{requestId}/rolls:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [live]
      summary: Execute an official roll (the request's roller). Faces are generated by the server.
      operationId: executeRoll
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 0 }
                dice_count: { type: [integer, 'null'], minimum: 1, maximum: 12, description: Only when the request allows a choice }
      responses:
        '201': { description: Resolved (or the original result on retry), content: { application/json: { schema: { $ref: '#/components/schemas/OfficialRoll' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /roll-requests/{requestId}/cancel:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [live]
      summary: Cancel an open request (master)
      operationId: cancelRollRequest
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/RollRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /roll-requests/{requestId}/grant-attempt:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [live]
      summary: Grant one more attempt (audited GM reroll)
      operationId: grantRollAttempt
      responses:
        '200': { description: Granted, content: { application/json: { schema: { $ref: '#/components/schemas/RollRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions/{sessionId}/npc-rolls:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [live]
      summary: The master rolls for an NPC (secret by default)
      operationId: npcRoll
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RollSpecInput'
                - type: object
                  required: [campaign_npc_id]
                  properties:
                    campaign_npc_id: { type: string, format: uuid }
                    secret: { type: boolean, default: true }
      responses:
        '201': { description: Resolved, content: { application/json: { schema: { $ref: '#/components/schemas/OfficialRoll' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /official-rolls/{rollId}/reveal:
    parameters: [{ name: rollId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [live]
      summary: Reveal a secret roll to the table (NPC rolls without NPC numbers)
      operationId: revealRoll
      responses:
        '200': { description: Revealed, content: { application/json: { schema: { $ref: '#/components/schemas/OfficialRoll' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/live-states/{kind}/{subjectId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - { name: kind, in: path, required: true, schema: { enum: [character, npc] } }
      - { name: subjectId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [live]
      summary: Replace resources and conditions of a character or NPC (master; revision 0 creates)
      operationId: saveLiveState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, resources, conditions]
              properties:
                revision: { type: integer, minimum: 0 }
                resources: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ResourceTrack' } }
                conditions: { type: array, maxItems: 12, items: { type: string, minLength: 1, maxLength: 40 } }
                items: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/LiveItem' }, description: Omitted keeps the current inventory }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: object, properties: { subject: { type: object }, live: { $ref: '#/components/schemas/LiveState' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /campaigns/{campaignId}/notes:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    get:
      tags: [live]
      summary: Private master notes
      operationId: listNotes
      responses:
        '200': { description: Notes, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/MasterNote' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [live]
      summary: Create a master note
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
                tags: { type: array, maxItems: 8, items: { type: string, maxLength: 24 } }
                pinned: { type: boolean }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MasterNote' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notes/{noteId}:
    parameters: [{ name: noteId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [live]
      summary: Autosave a note (revision conflicts are reported, never overwritten)
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1 }
                body: { type: string, maxLength: 4000 }
                tags: { type: array, maxItems: 8, items: { type: string, maxLength: 24 } }
                pinned: { type: boolean }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/MasterNote' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [live]
      summary: Delete a note
      operationId: deleteNote
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/{campaignId}/whispers:
    parameters: [{ $ref: '#/components/parameters/CampaignId' }]
    post:
      tags: [live]
      summary: Whisper to exactly one person (master → a player, player → a master)
      operationId: whisper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient_user_id, body]
              properties:
                recipient_user_id: { type: string, format: uuid }
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/Whisper' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /sessions/{sessionId}/clues:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [live]
      summary: Add a clue to the session (master)
      operationId: createClue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, body]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                body: { type: string, maxLength: 2000 }
                scene: { type: [string, 'null'], maxLength: 120 }
                image_id: { type: [string, 'null'], format: uuid, description: A campaign image shown with the clue (handout) }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Clue' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clues/{clueId}/reveal:
    parameters: [{ name: clueId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [live]
      summary: Reveal a clue to the table, or whisper it to one player
      operationId: revealClue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: { enum: [table, user] }
                user_id: { type: [string, 'null'], format: uuid }
      responses:
        '200': { description: Revealed, content: { application/json: { schema: { $ref: '#/components/schemas/Clue' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sessions/{sessionId}/npc-reveals:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [live]
      summary: Show an NPC to the table (name and a public line; never numbers or secrets)
      operationId: revealNpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [campaign_npc_id, summary]
              properties:
                campaign_npc_id: { type: string, format: uuid }
                summary: { type: string, maxLength: 300 }
      responses:
        '200': { description: Revealed, content: { application/json: { schema: { type: object, properties: { revealed_npcs: { type: array, items: { $ref: '#/components/schemas/RevealedNpc' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{sessionId}/suggestions:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [live]
      summary: A player suggests a combination to the master (never an official roll by itself)
      operationId: suggestRoll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [campaign_character_id, paths]
              properties:
                campaign_character_id: { type: string, format: uuid }
                paths: { type: array, minItems: 1, maxItems: 4, items: { type: string } }
                note: { type: [string, 'null'], maxLength: 200 }
      responses:
        '201': { description: Sent to the master, content: { application/json: { schema: { $ref: '#/components/schemas/RollSuggestion' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /suggestions/{suggestionId}/dismiss:
    parameters: [{ name: suggestionId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [live]
      summary: Dismiss a suggestion (master)
      operationId: dismissSuggestion
      responses:
        '204': { description: Dismissed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: novtt_session
      description: Sanctum stateful SPA session (first-party web clients). Requires the XSRF-TOKEN cookie / X-XSRF-TOKEN header.
    bearerToken:
      type: http
      scheme: bearer
      description: Sanctum personal access token (future native clients).
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignCharacterId:
      name: campaignCharacterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChangeRequestId:
      name: changeRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PresetVersionId:
      name: presetVersionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Request rejected (see `code`)
      content:
        application/problem+json:
          schema: { $ref: './problem.v1.schema.json' }
    Forbidden:
      description: Member without the required role (e.g. a player calling a master action)
      content:
        application/problem+json:
          schema: { $ref: './problem.v1.schema.json' }
    Unauthenticated:
      description: Not authenticated
      content:
        application/problem+json:
          schema: { $ref: './problem.v1.schema.json' }
    NotFound:
      description: Not found or not visible to the actor
      content:
        application/problem+json:
          schema: { $ref: './problem.v1.schema.json' }
    Conflict:
      description: Revision, state or idempotency conflict
      content:
        application/problem+json:
          schema: { $ref: './problem.v1.schema.json' }
    ValidationFailed:
      description: Validation failed (filtered novtt.validation-result/1 in `validation`)
      content:
        application/problem+json:
          schema: { $ref: './problem.v1.schema.json' }
    TooLarge:
      description: Payload above limits
      content:
        application/problem+json:
          schema: { $ref: './problem.v1.schema.json' }
    RateLimited:
      description: Too many attempts
      content:
        application/problem+json:
          schema: { $ref: './problem.v1.schema.json' }
  schemas:
    PresetPackage:
      type: object
      additionalProperties: false
      required: [manifest, sheet_schema, sheet_ui, rules]
      description: Each part is validated against the contract named by its own `contract` value.
      properties:
        manifest:
          oneOf:
            - $ref: '../presets/preset-manifest.v2.schema.json'
            - $ref: '../presets/preset-manifest.v1.schema.json'
        sheet_schema: { type: object, description: JSON Schema Draft 2020-12 for the sheet document }
        sheet_ui: { $ref: '../presets/sheet-ui.v1.schema.json' }
        rules:
          oneOf:
            - $ref: '../presets/rules.v2.schema.json'
            - $ref: '../presets/rules.v1.schema.json'
        compendium: { $ref: '../presets/compendium.v1.schema.json' }
    PresetVersionSummary:
      type: object
      required: [id, family_id, variant_id, version, display_name, status, canonical, rights_status, license, limitations, taxonomy]
      description: |
        Canonical entries appear in the catalogue only when `status` is `published` and
        `rights_status` is `approved` or `published`. Fields from manifest/2 are null for manifest/1.
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string }
        variant_id: { type: string }
        version: { type: string, description: Technical version of the encoding (SemVer) }
        display_name: { type: string }
        status: { enum: [draft, structurally_valid, engine_compatible, reviewed, published] }
        canonical: { type: boolean }
        rules_revision: { type: [string, 'null'], description: Edition/revision of the game rules }
        source_version: { type: [string, 'null'] }
        errata_reference: { type: [string, 'null'] }
        locale: { type: [string, 'null'] }
        license:
          type: object
          properties:
            identifier: { type: [string, 'null'] }
            attribution: { type: [string, 'null'] }
            source_url: { type: [string, 'null'] }
        rights_status: { enum: [draft, rights_review, approved, quarantined, published, retired] }
        source_authenticity: { enum: [official, licensed, community, original, null] }
        coverage: { enum: [schema_only, character_creation, progression, playable_core, full_licensed_scope, null] }
        limitations: { type: array, items: { type: string } }
        taxonomy:
          type: array
          description: Category names of this preset's compendium (e.g. its own word for class or lineage).
          items:
            type: object
            required: [kind, labels]
            properties:
              kind: { type: string }
              labels: { type: object, additionalProperties: { type: string } }
              parent_kind: { type: [string, 'null'] }
    PresetVersion:
      allOf:
        - $ref: '#/components/schemas/PresetVersionSummary'
        - type: object
          required: [content_hash, engine_version, validation_report, sheet_schema, sheet_ui, rules]
          properties:
            content_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
            engine_version: { type: string }
            validation_report: { $ref: '../sheets/validation-result.v1.schema.json' }
            sheet_schema: { type: object }
            sheet_ui: { $ref: '../presets/sheet-ui.v1.schema.json' }
            rules:
              oneOf:
                - $ref: '../presets/rules.v2.schema.json'
                - $ref: '../presets/rules.v1.schema.json'
    Campaign:
      type: object
      required: [id, name, status, revision, preset_version_id, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { enum: [active, archived] }
        revision: { type: integer }
        preset_version_id: { type: string, format: uuid }
        role: { enum: [master, player], description: Actor's role }
    Member:
      type: object
      required: [id, user_id, display_name, role]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        role: { enum: [master, player] }
    Invitation:
      type: object
      required: [id, role, max_uses, uses, expires_at, revoked]
      properties:
        id: { type: string, format: uuid }
        role: { const: player }
        max_uses: { type: integer }
        uses: { type: integer }
        expires_at: { type: string, format: date-time }
        revoked: { type: boolean }
    LibraryCharacter:
      type: object
      required: [id, name, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        preset_version_id: { type: [string, 'null'], format: uuid }
        archived: { type: boolean }
    CampaignCharacter:
      type: object
      required: [id, campaign_id, name, status, sheet_revision, player_user_id, in_custody, sheet]
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        name: { type: string }
        status: { enum: [draft, pending_approval, approved, archived] }
        sheet_revision: { type: integer }
        player_user_id: { type: string, format: uuid }
        in_custody: { type: boolean }
        preset_version_id: { type: string, format: uuid }
        portrait_image_id: { type: [string, 'null'], format: uuid, description: 'Set by the player (own character, any status) or the master via PUT /campaigns/{id}/portraits/character/{id}' }
        sheet:
          type: object
          description: |
            Official sheet with every field the actor may not read removed. Derived values declared
            by the preset are computed on read and written at their paths; they are never stored.
        decision_trace:
          type: array
          description: How each readable derived value was computed (base formula, effects, result).
          items:
            type: object
            required: [derived, path, base, modifiers, value]
            properties:
              derived: { type: string }
              path: { type: string }
              base: {}
              value: {}
              modifiers:
                type: array
                items:
                  type: object
                  required: [effect, mode, value, source, applied]
                  properties:
                    effect: { type: string }
                    mode: { enum: [add, set] }
                    value: {}
                    source: { type: object }
                    applied: { type: boolean }
        creation:
          type: object
          description: Present for rules/2 presets. Creation steps in order; approval requires `complete`.
          required: [complete, steps, issues]
          properties:
            complete: { type: boolean }
            steps:
              type: array
              items:
                type: object
                required: [id, available, complete, missing, condition_met, issues]
                properties:
                  id: { type: string }
                  available: { type: boolean }
                  complete: { type: boolean }
                  missing: { type: array, items: { type: string } }
                  condition_met: { type: boolean }
                  issues: { type: integer }
            issues: { type: array, items: { type: object } }
        choices: { $ref: '#/components/schemas/CharacterChoices' }
    CharacterChoices:
      type: array
      description: >-
        Present for rules/2 presets. Each declared choice the viewer may read, its current value and
        which options the sheet's prerequisites allow now. Presentation aid only; the server still
        validates every submission.
      items:
        type: object
        required: [id, path, value, options]
        properties:
          id: { type: string }
          path: { type: string }
          value: { type: [string, integer, boolean, 'null'] }
          options:
            type: array
            items:
              type: object
              required: [value, available]
              properties:
                value: { type: [string, integer, boolean] }
                available: { type: boolean }
    SheetPreview:
      type: object
      description: >-
        The draft applied to the official sheet, projected for the author exactly like
        CampaignCharacter.sheet (derived values included, hidden fields removed). Never stored.
      required: [sheet, decision_trace]
      properties:
        sheet: { type: object }
        decision_trace: { type: array, items: { type: object } }
        creation: { type: object, description: 'Same shape as CampaignCharacter.creation, computed for the candidate sheet.' }
        choices: { $ref: '#/components/schemas/CharacterChoices' }
    Grant:
      type: object
      required: [id, budget_id, amount, created_at]
      properties:
        id: { type: string, format: uuid }
        budget_id: { type: string }
        amount: { type: integer }
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    LibraryNpc:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        preset_version_id: { type: [string, 'null'], format: uuid }
        private_notes: { type: [string, 'null'] }
    CampaignNpc:
      type: object
      required: [id, campaign_id, name, sheet]
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        source_npc_id: { type: [string, 'null'], format: uuid }
        name: { type: string }
        sheet: { type: object }
    Draft:
      type: object
      required: [campaign_character_id, draft_version, base_sheet_revision, change_set, validation, balances]
      properties:
        campaign_character_id: { type: string, format: uuid }
        draft_version: { type: integer }
        base_sheet_revision: { type: integer }
        change_set: { $ref: '../sheets/sheet-change-set.v1.schema.json' }
        validation: { $ref: '../sheets/validation-result.v1.schema.json' }
        balances:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Remaining balance per budget id if this draft were applied (additive since 2026-11-22).
            Same values the actor can already read via the grants endpoint.
        preview:
          description: Candidate sheet for the guided builder (additive since 2026-11-23).
          oneOf:
            - $ref: '#/components/schemas/SheetPreview'
            - type: 'null'
    OperationView:
      type: object
      required: [id, type, path, section_id]
      properties:
        id: { type: string }
        type: { enum: [set_field, unset_field, add_item, set_item_field, remove_item, reorder_items] }
        path: { type: string }
        section_id: { type: string }
        item_id: { type: [string, 'null'] }
        field: { type: [string, 'null'] }
        value: {}
        order: { type: [array, 'null'], items: { type: string } }
        decision:
          type: [object, 'null']
          required: [decision, final]
          properties:
            decision: { enum: [approved, rejected] }
            reason: { type: [string, 'null'] }
            final: { type: boolean }
    ChangeRequest:
      type: object
      required: [id, campaign_character_id, status, base_sheet_revision, review_version, sections]
      properties:
        id: { type: string, format: uuid }
        campaign_character_id: { type: string, format: uuid }
        status: { enum: [submitted, in_review, awaiting_resolution, applied, rejected, withdrawn, superseded] }
        base_sheet_revision: { type: integer }
        review_version: { type: integer }
        resulting_sheet_revision: { type: [integer, 'null'] }
        sections:
          type: array
          items:
            type: object
            required: [section_id, label, operations]
            properties:
              section_id: { type: string }
              label: { type: string }
              operations: { type: array, items: { $ref: '#/components/schemas/OperationView' } }
        validation: { $ref: '../sheets/validation-result.v1.schema.json' }
    RebasePreview:
      type: object
      required: [preview_token, base_sheet_revision, current_sheet_revision, conflicts]
      properties:
        preview_token: { type: string }
        base_sheet_revision: { type: integer }
        current_sheet_revision: { type: integer }
        conflicts:
          type: array
          items:
            type: object
            required: [operation_id, kind, path]
            properties:
              operation_id: { type: string }
              kind: { enum: [value_changed, target_removed, item_removed, permission_changed, previously_rejected] }
              path: { type: string }
              base: {}
              current: {}
              mine: {}
    Me:
      type: object
      required: [id, name, paired_device_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        paired_device_id: { type: [string, 'null'], format: uuid, description: Set on a paired tablet session }
    GameSession:
      type: object
      required: [id, campaign_id, title, status, initiative, revealed_npcs, last_seq, revision, started_at]
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        title: { type: string }
        status: { enum: [active, paused, ended] }
        roteiro_id: { type: [string, 'null'], format: uuid }
        initiative: { $ref: '#/components/schemas/Initiative' }
        revealed_npcs: { type: array, items: { $ref: '#/components/schemas/RevealedNpc' } }
        compass: { $ref: '#/components/schemas/Compass', description: Masters only }
        plot: { $ref: '#/components/schemas/Plot', description: Masters only }
        stage: { oneOf: [{ $ref: '#/components/schemas/Stage' }, { type: 'null' }], description: What the whole table sees now }
        atmosphere: { oneOf: [{ $ref: '#/components/schemas/Atmosphere' }, { type: 'null' }], description: Time of day and weather for the whole table; null until the master sets it }
        clocks: { type: array, items: { $ref: '#/components/schemas/PlayerClock' }, description: 'Players only: the clocks shown to the table or to this player (no visibility metadata). Masters read compass.clocks instead.' }
        last_seq: { type: integer }
        revision: { type: integer }
        started_at: { type: string, format: date-time }
    Compass:
      type: object
      required: [scene, objective, next_clue, clocks, spotlight]
      properties:
        scene: { type: string, maxLength: 120 }
        objective: { type: string, maxLength: 300 }
        next_clue: { type: string, maxLength: 300 }
        clocks:
          type: array
          maxItems: 8
          items:
            type: object
            required: [id, label, segments, filled]
            properties:
              id: { type: string, maxLength: 40 }
              label: { type: string, maxLength: 80 }
              segments: { type: integer, minimum: 2, maximum: 12 }
              filled: { type: integer, minimum: 0, maximum: 12 }
              tone: { enum: [threat, progress, mystery, neutral], default: threat, description: Colour and meaning on screen }
              visibility: { enum: [master, table, players], default: master, description: 'master: console only; table: every player; players: only player_ids' }
              player_ids: { type: array, maxItems: 20, items: { type: string, format: uuid }, description: 'User ids when visibility = players; ids that are not active players of the campaign are dropped' }
        spotlight: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: 'Moments in the spotlight per character id' }
    PlayerClock:
      type: object
      required: [id, label, segments, filled, tone]
      properties:
        id: { type: string, maxLength: 40 }
        label: { type: string, maxLength: 80 }
        segments: { type: integer, minimum: 2, maximum: 12 }
        filled: { type: integer, minimum: 0, maximum: 12 }
        tone: { enum: [threat, progress, mystery, neutral] }
    Initiative:
      type: object
      properties:
        entries: { type: array, items: { type: object, properties: { kind: { enum: [character, npc] }, id: { type: string, format: uuid }, name: { type: string } } } }
        turn: { type: integer }
        round: { type: integer }
    RevealedNpc:
      type: object
      required: [id, name, summary]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        summary: { type: string }
        portrait_image_id: { type: [string, 'null'], format: uuid }
    SceneArt:
      description: Key of an original scene illustration shipped with the clients
      enum: [bridge, forest, tavern, ruins, city, cave, sea, camp, road, castle, swamp, temple, null]
    PlotScene:
      type: object
      required: [title]
      properties:
        id: { type: [string, 'null'], maxLength: 40, description: Assigned by the server when empty }
        title: { type: string, minLength: 1, maxLength: 120 }
        goal: { type: [string, 'null'], maxLength: 300 }
        location: { type: [string, 'null'], maxLength: 120 }
        read_aloud: { type: [string, 'null'], maxLength: 1500 }
        npcs: { type: array, maxItems: 8, items: { type: string, minLength: 1, maxLength: 80 } }
        art: { $ref: '#/components/schemas/SceneArt' }
        image_id: { type: [string, 'null'], format: uuid }
        complication: { type: [string, 'null'], maxLength: 500 }
        status: { enum: [pending, current, done], description: Recomputed by the server from current }
    Plot:
      type: object
      required: [scenes, current]
      properties:
        scenes: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/PlotScene' } }
        current: { type: [integer, 'null'], minimum: 0 }
    Stage:
      type: object
      required: [title, text, art, image_id, shown_at]
      properties:
        title: { type: string }
        text: { type: string }
        art: { $ref: '#/components/schemas/SceneArt' }
        image_id: { type: [string, 'null'], format: uuid }
        shown_at: { type: string, format: date-time }
    Weather:
      enum: [clear, clouds, rain, storm, fog, snow]
    Atmosphere:
      type: object
      required: [hour, weather, intensity, time_scale, transition_seconds, set_at, revision]
      properties:
        hour: { type: number, minimum: 0, exclusiveMaximum: 24, description: Hour of day when set_at was recorded }
        weather: { $ref: '#/components/schemas/Weather' }
        intensity: { type: number, minimum: 0, maximum: 1 }
        fog: { type: number, minimum: 0, maximum: 1, description: 'Fog layer over any weather (0 = none). Optional in requests; always present in responses saved after 1.5.0.' }
        time_scale: { type: integer, minimum: 0, maximum: 120 }
        transition_seconds: { type: integer, minimum: 0, maximum: 30 }
        set_at: { type: string, format: date-time }
        revision: { type: integer, minimum: 1, description: Increments on every save; independent of the session revision }
    CampaignImage:
      type: object
      required: [id, kind, width, height]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [portrait, scene, handout] }
        width: { type: integer }
        height: { type: integer }
    LiveItem:
      type: object
      required: [id, label, qty]
      properties:
        id: { type: string, maxLength: 40 }
        label: { type: string, minLength: 1, maxLength: 80 }
        qty: { type: integer, minimum: 0, maximum: 999 }
        note: { type: [string, 'null'], maxLength: 200 }
    PrepCarryOver:
      type: object
      required: [unrevealed_clues, open_threads, characters, last_roteiro_title]
      properties:
        unrevealed_clues: { type: array, items: { type: object, properties: { title: { type: string }, body: { type: string }, scene: { type: [string, 'null'] } } } }
        open_threads: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, title: { type: string }, summary: { type: string }, thread_status: { enum: [open, advancing, resolved, null] } } } }
        characters: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, concept: { type: [string, 'null'] }, motivation: { type: [string, 'null'] } } } }
        last_roteiro_title: { type: [string, 'null'] }
    RollSpecInput:
      type: object
      required: [paths, dice]
      properties:
        label: { type: [string, 'null'], maxLength: 120 }
        paths: { type: array, maxItems: 4, items: { type: string }, description: 'Integer sheet fields to combine (attribute + skill); values are read from the official sheet' }
        modifier: { type: integer, minimum: -20, maximum: 20 }
        dice: { $ref: '#/components/schemas/DiceSpecInput' }
    DiceSpecInput:
      type: object
      required: [faces, count_mode, reading]
      description: Chosen by the master (SPEC-MVP-002 D3). In pool mode the dice count is the combination plus modifier (1–12); in fixed mode the combination plus modifier is a bonus added to the total.
      properties:
        faces: { enum: [4, 6, 8, 10, 12, 20, 100] }
        count_mode: { enum: [pool, fixed] }
        count: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        reading: { enum: [sum, highest, successes] }
        threshold: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        successes_per_die: { type: integer, minimum: 1, maximum: 3 }
        target: { type: [integer, 'null'], description: 'Minimum total (sum/highest) or successes needed' }
    DiceSpec:
      type: object
      required: [faces, count_mode, reading, threshold, successes_per_die, target, bonus]
      properties:
        faces: { type: integer }
        count_mode: { enum: [pool, fixed] }
        reading: { enum: [sum, highest, successes] }
        threshold: { type: integer }
        successes_per_die: { type: integer }
        target: { type: [integer, 'null'] }
        bonus: { type: [integer, 'null'], description: null when an NPC roll is shown to players }
    RollComponent:
      type: object
      required: [path, label]
      properties:
        path: { type: string }
        label: { type: string }
        value: { type: integer, description: Omitted for NPC rolls shown to players }
    RollSubject:
      type: object
      required: [kind, id, name]
      properties:
        kind: { enum: [character, npc] }
        id: { type: string, format: uuid }
        name: { type: string }
    RollRequest:
      type: object
      required: [id, session_id, subject, roller_user_id, label, components, modifier, dice, min_dice, max_dice, allows_choice, attempts_allowed, attempts_consumed, secret, status, revision]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        subject: { $ref: '#/components/schemas/RollSubject' }
        roller_user_id: { type: string, format: uuid }
        label: { type: string }
        components: { type: array, items: { $ref: '#/components/schemas/RollComponent' } }
        modifier: { type: integer }
        dice: { $ref: '#/components/schemas/DiceSpec' }
        min_dice: { type: integer }
        max_dice: { type: integer }
        allows_choice: { type: boolean }
        attempts_allowed: { type: integer }
        attempts_consumed: { type: integer }
        secret: { type: boolean }
        status: { enum: [OPEN, EXHAUSTED, CANCELLED, EXPIRED, CLOSED] }
        revision: { type: integer }
        expires_at: { type: [string, 'null'], format: date-time }
    OfficialRoll:
      type: object
      required: [id, request_id, session_id, subject, roller_user_id, label, components, dice, results, total, successes, succeeded, attempt, attempts_allowed, animation_seed, secret, revealed, created_at]
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        subject: { $ref: '#/components/schemas/RollSubject' }
        roller_user_id: { type: string, format: uuid }
        label: { type: string }
        components: { type: array, items: { $ref: '#/components/schemas/RollComponent' } }
        modifier: { type: [integer, 'null'] }
        dice: { $ref: '#/components/schemas/DiceSpec' }
        results: { type: array, minItems: 1, maxItems: 12, items: { type: integer, minimum: 1 }, description: Server-generated faces; every client's dice settle on these }
        total: { type: integer }
        successes: { type: integer }
        succeeded: { type: [boolean, 'null'] }
        attempt: { type: integer }
        attempts_allowed: { type: integer }
        animation_seed: { type: integer, description: 'Shapes the throw only (novtt.dice-roll-animation/1); never the result' }
        secret: { type: boolean }
        revealed: { type: boolean }
        created_at: { type: string, format: date-time }
    ResourceTrack:
      type: object
      required: [id, label, current, max]
      properties:
        id: { type: string, pattern: '^[a-z0-9_-]{1,32}$' }
        label: { type: string, minLength: 1, maxLength: 40 }
        current: { type: integer, minimum: -99, maximum: 999 }
        max: { type: integer, minimum: 1, maximum: 999 }
    LiveState:
      type: object
      required: [resources, conditions, revision]
      properties:
        resources: { type: array, items: { $ref: '#/components/schemas/ResourceTrack' } }
        conditions: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: '#/components/schemas/LiveItem' } }
        revision: { type: integer }
    MasterNote:
      type: object
      required: [id, body, tags, pinned, revision]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: [string, 'null'], format: uuid }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        pinned: { type: boolean }
        revision: { type: integer }
        updated_at: { type: [string, 'null'], format: date-time }
    Whisper:
      type: object
      required: [id, sender_user_id, recipient_user_id, kind, body, created_at]
      properties:
        id: { type: string, format: uuid }
        sender_user_id: { type: string, format: uuid }
        recipient_user_id: { type: string, format: uuid }
        kind: { enum: [message, clue] }
        body: { type: string }
        created_at: { type: string, format: date-time }
    Clue:
      type: object
      required: [id, title, body, revealed_to]
      properties:
        id: { type: string, format: uuid }
        scene: { type: [string, 'null'] }
        title: { type: string }
        body: { type: string }
        revealed_to: { enum: [table, user, null] }
        revealed_user_id: { type: [string, 'null'], format: uuid, description: Masters only }
        revealed_at: { type: [string, 'null'], format: date-time }
        image_id: { type: [string, 'null'], format: uuid }
    RollSuggestion:
      type: object
      required: [id, campaign_character_id, character_name, player_user_id, paths, status]
      properties:
        id: { type: string, format: uuid }
        campaign_character_id: { type: string, format: uuid }
        character_name: { type: string }
        player_user_id: { type: string, format: uuid }
        paths: { type: array, items: { type: string } }
        note: { type: [string, 'null'] }
        status: { enum: [pending, accepted, dismissed] }
    TableSnapshot:
      type: object
      required: [contract, role, me, session, members, characters, npcs, requests, rolls, whispers, clues, suggestions, notes]
      description: Everything one participant may see; players never receive compass, NPCs, notes or other players' secrets.
      properties:
        contract: { const: novtt.table-snapshot/1 }
        role: { enum: [master, player] }
        me: { type: object, properties: { user_id: { type: string, format: uuid }, name: { type: string } } }
        session: { $ref: '#/components/schemas/GameSession' }
        members: { type: array, items: { type: object, properties: { user_id: { type: string, format: uuid }, name: { type: string }, role: { enum: [master, player] } } } }
        characters:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              player_user_id: { type: string, format: uuid }
              controlled_by: { type: string, format: uuid }
              status: { type: string }
              preset_version_id: { type: string, format: uuid }
              portrait_image_id: { type: [string, 'null'], format: uuid }
              concept: { type: [string, 'null'], description: Sheet /identity/concept; only for the master and the character's controller }
              live: { oneOf: [{ $ref: '#/components/schemas/LiveState' }, { type: 'null' }] }
        npcs: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, preset_version_id: { type: string, format: uuid }, portrait_image_id: { type: [string, 'null'], format: uuid }, live: { oneOf: [{ $ref: '#/components/schemas/LiveState' }, { type: 'null' }] } } }, description: Masters only (empty for players) }
        requests: { type: array, items: { $ref: '#/components/schemas/RollRequest' } }
        rolls: { type: array, items: { $ref: '#/components/schemas/OfficialRoll' } }
        whispers: { type: array, items: { $ref: '#/components/schemas/Whisper' } }
        clues: { type: array, items: { $ref: '#/components/schemas/Clue' } }
        suggestions: { type: array, items: { $ref: '#/components/schemas/RollSuggestion' } }
        notes: { type: array, items: { $ref: '#/components/schemas/MasterNote' } }
    RoteiroContent:
      type: object
      properties:
        strong_start: { type: string, maxLength: 1000 }
        scenes:
          type: array
          maxItems: 16
          items:
            type: object
            required: [title, goal, clues]
            properties:
              title: { type: string, maxLength: 120 }
              goal: { type: string, maxLength: 300 }
              location: { type: [string, 'null'], maxLength: 120 }
              read_aloud: { type: [string, 'null'], maxLength: 1500 }
              npcs: { type: array, maxItems: 8, items: { type: string, maxLength: 80 } }
              art: { $ref: '#/components/schemas/SceneArt' }
              image_id: { type: [string, 'null'], format: uuid }
              complication: { type: [string, 'null'], maxLength: 500 }
              clues: { type: array, maxItems: 8, items: { type: object, required: [title, body], properties: { title: { type: string, maxLength: 120 }, body: { type: string, maxLength: 1000 } } } }
        npcs: { type: array, maxItems: 20, items: { type: object, required: [name, voice, wants, secret], properties: { name: { type: string }, voice: { type: string }, wants: { type: string }, secret: { type: string } } } }
        clocks: { type: array, maxItems: 6, items: { type: object, required: [label, segments], properties: { label: { type: string }, segments: { type: integer, minimum: 2, maximum: 12 } } } }
        wants: { type: array, maxItems: 12, items: { type: object, required: [character, text], properties: { character: { type: string }, text: { type: string } } } }
        locations: { type: array, maxItems: 8, items: { type: object, required: [name, aspects], properties: { name: { type: string, maxLength: 80 }, aspects: { type: array, maxItems: 3, items: { type: string, maxLength: 120 } } } } }
        rewards: { type: array, maxItems: 10, items: { type: string, maxLength: 200 } }
    Roteiro:
      type: object
      required: [id, campaign_id, title, content, revision]
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        title: { type: string }
        content: { $ref: '#/components/schemas/RoteiroContent' }
        revision: { type: integer }
        updated_at: { type: [string, 'null'], format: date-time }
    AtlasEntryInput:
      type: object
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }
        kind: { enum: [place, person, faction, secret, thread] }
        title: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, maxLength: 500 }
        details: { type: string, maxLength: 8000 }
        known_to_players: { type: boolean, description: Always false for secrets }
        thread_status: { enum: [open, advancing, resolved, null] }
        links: { type: array, maxItems: 20, items: { type: string, format: uuid } }
    AtlasTimelineItem:
      type: object
      required: [id, note, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: [string, 'null'], format: uuid }
        note: { type: string }
        created_at: { type: string, format: date-time }
    AtlasEntry:
      type: object
      required: [id, kind, title, summary]
      description: Players receive id, kind, title, summary and thread_status only.
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [place, person, faction, secret, thread] }
        title: { type: string }
        summary: { type: string }
        thread_status: { enum: [open, advancing, resolved, null] }
        details: { type: string }
        known_to_players: { type: boolean }
        links: { type: array, items: { type: string, format: uuid } }
        revision: { type: integer }
        timeline: { type: array, items: { $ref: '#/components/schemas/AtlasTimelineItem' } }
