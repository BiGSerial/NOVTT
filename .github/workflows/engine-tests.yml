name: Engine checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Validate syntax
        run: |
          find apps/api/src apps/api/tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run deterministic checks
        run: php apps/api/tests/all.php
