name: novtt
# Shared runtime configuration of the API processes (HTTP, Reverb, queue worker, outbox relay).
# Local development only: Redis and Reverb are reachable only inside the compose network.
x-api-env: &api-env
  DB_HOST: postgres
  DB_DATABASE: ${NOVTT_DB_NAME:-novtt_dev}
  DB_USERNAME: ${NOVTT_DB_USER:-novtt}
  DB_PASSWORD: ${NOVTT_DB_PASSWORD:-}
  NOVTT_DEMO_MODE: ${NOVTT_DEMO_MODE:-false}
  SANCTUM_STATEFUL_DOMAINS: localhost,localhost:${NOVTT_PLAYER_PORT:-5173},127.0.0.1,127.0.0.1:${NOVTT_PLAYER_PORT:-5173}
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: novtt-local
  REVERB_APP_KEY: ${NOVTT_REVERB_APP_KEY:-}
  REVERB_APP_SECRET: ${NOVTT_REVERB_APP_SECRET:-}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SCALING_ENABLED: "true"
  REVERB_ALLOWED_ORIGINS: localhost,127.0.0.1
services:
  engine:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /workspace/packages/engine
    volumes:
      - ./:/workspace
      - engine-vendor:/workspace/packages/engine/vendor
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && composer test"]
    profiles: ["test"]
    security_opt: ["no-new-privileges:true"]
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /workspace/apps/api
    volumes:
      - ./:/workspace
      - api-vendor:/workspace/apps/api/vendor
    ports:
      - "127.0.0.1:${NOVTT_API_PORT:-8000}:8000"
    # php -S (not artisan serve) so the server process inherits this environment; artisan serve
    # only forwards a fixed allow-list of variables to its workers.
    environment:
      <<: *api-env
      PHP_CLI_SERVER_WORKERS: "4"
    depends_on: &api-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && { [ -f .env ] || { cp .env.example .env && chown --reference=.env.example .env && php artisan key:generate; }; } && cd public && exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]
    init: true
    security_opt: ["no-new-privileges:true"]
    profiles: ["api"]
  # WebSocket server (Pusher protocol). Not published: the dev server proxies /app to it.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /workspace/apps/api
    volumes:
      - ./:/workspace
      - api-vendor:/workspace/apps/api/vendor
    environment: *api-env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["sh", "-c", "until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 1; done; exec php artisan reverb:start --host=0.0.0.0 --port=8080"]
    init: true
    security_opt: ["no-new-privileges:true"]
    profiles: ["api"]
  # Queue worker (broadcast jobs) and outbox relay (retries anything not yet delivered).
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /workspace/apps/api
    volumes:
      - ./:/workspace
      - api-vendor:/workspace/apps/api/vendor
    environment: *api-env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["sh", "-c", "until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 1; done; php artisan novtt:events:relay --loop & exec php artisan queue:work redis --tries=5 --backoff=1 --sleep=1"]
    init: true
    security_opt: ["no-new-privileges:true"]
    profiles: ["api"]
  api-test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /workspace/apps/api
    volumes:
      - ./:/workspace
      - api-vendor:/workspace/apps/api/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres-test
      DB_PORT: "5432"
      DB_DATABASE: novtt_test
      DB_USERNAME: novtt_test
      DB_PASSWORD: novtt_test
    depends_on:
      postgres-test:
        condition: service_healthy
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && { [ -f .env ] || { cp .env.example .env && chown --reference=.env.example .env && php artisan key:generate; }; } && composer test && composer audit"]
    security_opt: ["no-new-privileges:true"]
    profiles: ["test"]
  postgres-test:
    # Ephemeral, unpublished database used only by automated tests. The fixed
    # credentials are not secrets: the service has no host port and no volume.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: novtt_test
      POSTGRES_USER: novtt_test
      POSTGRES_PASSWORD: novtt_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novtt_test -d novtt_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    profiles: ["test"]
  player:
    image: node:24-bookworm-slim
    working_dir: /workspace/apps/player-pwa
    volumes:
      - ./:/workspace
      - player-modules:/workspace/apps/player-pwa/node_modules
    ports:
      - "127.0.0.1:${NOVTT_PLAYER_PORT:-5173}:5173"
    environment:
      # The dev server proxies /api and /sanctum so the SPA and API share one origin (ADR 0009).
      NOVTT_API_PROXY: http://api:8000
      NOVTT_WS_PROXY: ws://reverb:8080
      # Public Reverb app key (sent to every browser anyway); the secret never leaves the API.
      VITE_REVERB_APP_KEY: ${NOVTT_REVERB_APP_KEY:-}
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    init: true
    security_opt: ["no-new-privileges:true"]
    profiles: ["player"]
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${NOVTT_DB_NAME:-novtt_dev}
      POSTGRES_USER: ${NOVTT_DB_USER:-novtt}
      POSTGRES_PASSWORD: ${NOVTT_DB_PASSWORD:?Configure NOVTT_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["infra", "api"]
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    profiles: ["infra", "api"]
    security_opt: ["no-new-privileges:true"]
volumes:
  api-vendor:
  engine-vendor:
  player-modules:
  postgres-data:
  redis-data:
