name: NOVTT checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'test/**'
      - 'ci/**'
      - 'perf/**'
      - 'hotfix/**'
      - 'release/**'

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name and merge target
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          pattern='^(feature|fix|chore|docs|refactor|test|ci|perf|hotfix|release)/[a-z0-9][a-z0-9._-]*$'
          if [ "$HEAD_REF" != "develop" ] && ! [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::Branch '$HEAD_REF' fora do padrão. Veja docs/development/branching.md"
            exit 1
          fi
          if [ "$BASE_REF" = "main" ] && ! [[ "$HEAD_REF" =~ ^(develop|release/.+|hotfix/.+)$ ]]; then
            echo "::error::PRs para main só podem vir de develop, release/* ou hotfix/*."
            exit 1
          fi
          echo "Branch '$HEAD_REF' -> '$BASE_REF' OK"

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Validate PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit
        run: composer test
      - name: Composer audit
        run: composer audit

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: novtt_test
          POSTGRES_USER: novtt_test
          POSTGRES_PASSWORD: novtt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novtt_test -d novtt_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: pdo_pgsql, gd
      - name: Validate PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: Run tests
        run: composer test
      - name: Composer audit
        run: composer audit

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Lint OpenAPI (and every referenced JSON Schema)
        working-directory: contracts
        run: npx --yes @redocly/cli@2.76.0 lint http/openapi.v1.yaml

  player-pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/player-pwa/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Build
        run: npm run build
